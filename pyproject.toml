[project]
name = "pronostia-bearing-monitor"
version = "0.1.0"
description = "Industrial bearing failure flagging, Health Indicator, and RUL prediction on the PRONOSTIA (IEEE PHM 2012) vibration dataset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "pyarrow>=16.0.0",
    "streamlit>=1.38.0",
    "plotly>=5.22.0",
]

[project.scripts]
pronostia-download = "pronostia.download:main"
pronostia-train = "pronostia.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pronostia"]
